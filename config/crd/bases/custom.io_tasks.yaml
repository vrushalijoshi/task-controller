---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tasks.custom.io
spec:
  group: custom.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    shortNames:
    - tk
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.lastExecutionTime
      name: Last Execution
      type: date
    - jsonPath: .status.nextScheduleTime
      name: Next
      type: string
    - jsonPath: .status.succeededCount
      name: Succeeded
      type: integer
    - jsonPath: .status.failedCount
      name: Failed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.command
      name: Command
      priority: 1
      type: string
    - jsonPath: .spec.image
      name: Image
      priority: 1
      type: string
    - jsonPath: .status.activeJob
      name: Active Job
      priority: 1
      type: string
    - jsonPath: .status.lastCompletionTime
      name: Last Completion
      priority: 1
      type: date
    - jsonPath: .status.conditions[?(@.type=='ScheduleValid')].status
      name: Schedule Valid
      priority: 1
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Task is the Schema for the tasks API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Task
            properties:
              activeDeadlineSeconds:
                description: |-
                  activeDeadlineSeconds bounds a single run, so a hung execution cannot
                  block every later slot under the Forbid concurrency policy.
                format: int64
                maximum: 86400
                minimum: 1
                type: integer
              backoffLimit:
                default: 0
                description: |-
                  backoffLimit is the Job retry count. It defaults to 0, unlike the Job
                  default of 6, so a failure surfaces immediately instead of minutes
                  later; capped at 10 since surfacing failures fast is the point.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              command:
                description: |-
                  command is executed as `/bin/sh -c <command>`. It is intended to be a
                  one-liner; longer logic belongs in spec.image or a mounted ConfigMap.
                  The 4096 bound keeps Task objects small (cache memory scales with it)
                  and stays far below MAX_ARG_STRLEN, past which exec would fail at
                  runtime rather than at admission.
                maxLength: 4096
                minLength: 1
                type: string
              image:
                default: busybox:1.36
                description: image is the container image each run executes in.
                maxLength: 512
                minLength: 1
                pattern: ^\S+$
                type: string
              schedule:
                description: |-
                  schedule is a 5-field cron expression or a descriptor (@hourly, @daily,
                  @every 10m), interpreted in UTC. The pattern below is a cheap shape gate
                  only: CEL cannot parse cron, so the authoritative parse and the
                  satisfiability and minimum-interval checks happen in the controller and
                  surface on the ScheduleValid condition.
                maxLength: 256
                minLength: 1
                pattern: ^(@(annually|yearly|monthly|weekly|daily|midnight|hourly)|@every
                  +[0-9]+(ns|us|ms|s|m|h)|([^ ]+ +){4}[^ ]+)$
                type: string
              startingDeadlineSeconds:
                description: |-
                  startingDeadlineSeconds bounds how late a missed slot may still run,
                  which keeps a restart after downtime from running a stale slot. Unset
                  means the most recent missed slot runs however late it is. Minimum is 1
                  because 0 is a degenerate "deadline of zero" that silently means never.
                format: int64
                minimum: 1
                type: integer
              suspend:
                description: suspend pauses scheduling without deleting the Task or
                  its history.
                type: boolean
            required:
            - command
            - schedule
            type: object
          status:
            description: status defines the observed state of Task
            properties:
              activeJob:
                description: activeJob is the Job currently executing, if any.
                maxLength: 63
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the Task resource.
                  ScheduleValid reports whether spec.schedule can ever produce a run.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failedCount:
                format: int32
                minimum: 0
                type: integer
              lastCompletionTime:
                description: lastCompletionTime is when the most recent run finished.
                format: date-time
                type: string
              lastExecutionTime:
                description: lastExecutionTime is when the controller last created
                  a Job.
                format: date-time
                type: string
              lastFinishedScheduleTime:
                description: |-
                  lastFinishedScheduleTime is the idempotency key for outcome recording:
                  a finished Job whose slot is at or before this has already been counted,
                  so it is skipped and only deleted. This is what makes a Job's outcome
                  recorded exactly once even if the delete fails and it is seen again.
                format: date-time
                type: string
              lastScheduleTime:
                description: |-
                  lastScheduleTime is the most recent slot acted on. It anchors
                  missed-slot math and is deliberately separate from lastExecutionTime,
                  because a Job can be created late for an earlier slot.
                format: date-time
                type: string
              message:
                description: message is a human-readable note about the most recent
                  transition.
                maxLength: 1024
                type: string
              nextScheduleTime:
                description: |-
                  nextScheduleTime is when the next run is due. Cleared when the schedule
                  is invalid, so status never promises a run that cannot happen.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              recentRuns:
                description: |-
                  recentRuns holds the most recent executions, newest first, capped at
                  MaxRecentRuns. The Jobs themselves are deleted as soon as their outcome
                  is durable, so this is the surviving run history.
                items:
                  description: |-
                    TaskRun is a high-level record of one finished execution. The Job and its
                    pods are deleted once the outcome is recorded, so this is what survives.
                  properties:
                    completionTime:
                      format: date-time
                      type: string
                    jobName:
                      description: |-
                        jobName is the Job that ran this slot. The Job itself is deleted once
                        the outcome is recorded.
                      maxLength: 63
                      type: string
                    message:
                      description: message explains the outcome, e.g. "BackoffLimitExceeded".
                      maxLength: 1024
                      type: string
                    result:
                      description: result is the outcome of the run.
                      enum:
                      - Succeeded
                      - Failed
                      - Aborted
                      type: string
                    scheduledTime:
                      description: scheduledTime is the cron slot this run belongs
                        to.
                      format: date-time
                      type: string
                    startTime:
                      format: date-time
                      type: string
                  required:
                  - jobName
                  - result
                  - scheduledTime
                  type: object
                maxItems: 3
                type: array
                x-kubernetes-list-type: atomic
              state:
                description: state is the state of the most recent execution. See
                  TaskState.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              succeededCount:
                description: |-
                  succeededCount and failedCount are durable totals. Prometheus counters
                  reset when the process restarts; these do not.
                format: int32
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: Task name must be 52 characters or fewer; Job names append a slot
            suffix
          rule: self.metadata.name.size() <= 52
    served: true
    storage: true
    subresources:
      status: {}
